<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13151a" media="(prefers-color-scheme: dark)">
<title>Screeps lookup</title>
<meta name="description" content="Find the Screeps API call for a task: signature, cost, return codes, pitfalls, with drawings of how each rule works.">
<style>
/* Layout: the standard documentation page on one grid of three columns: sections | reading column |
   the headings of the page. The top bar sits on the same columns, so the search field is exactly as
   wide as the reading column. Inside the column there are two right edges: text ends at --measure,
   blocks (code, tables, drawings) at the column. The page is neutral with one accent for links and
   the current place; drawings are the only part with the look of the game.
   The rules behind these choices are in CONTRIBUTING.md, "Design". */
:root {
  color-scheme: light;
  /* neutrals lean slightly towards the accent; text is never pure black */
  --bg: #ffffff;      --bg-2: #f6f7f9;    --bg-3: #eceef2;    --line: #e2e5ea;   --line-2: #8b93a3;
  --text: #1b1f27;    --text-2: #4c5464;  --text-3: #5f6778;
  --accent: #2b5ce6;  --accent-2: #1e47c2; --accent-bg: #edf2ff;
  --warn: #8f5200;    --warn-bg: #fff5de;
  --good: #1a7f4e;    --bad: #c0362c;
  --code-bg: #f3f4f7;
  --s1: #2a78d6;      --s2: #d4561f;      --s3: #168a61;      /* chart series, fixed order */
  /* the game's own colours: body parts and the ground */
  --p-m: #aab7c5;     --p-w: #fde574;     --p-c: #666666;     --p-a: #f72e41;
  --p-r: #7fa7e5;     --p-h: #56cf5e;     --p-t: #ffffff;     --p-l: #b99cfb;
  --ground: #2b2b2b;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Code", "Cascadia Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --top: 56px;        --side: 272px;      --toc: 232px;       --col: 760px;      --measure: 600px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    /* no pure black, no pure white; the accent is lighter and less saturated than in the light theme */
    --bg: #13151a;      --bg-2: #1a1d24;    --bg-3: #232732;    --line: #2a2e39;   --line-2: #5c6475;
    --text: #e4e7ed;    --text-2: #aab1bf;  --text-3: #9097a7;
    --accent: #8eb0ff;  --accent-2: #adc5ff; --accent-bg: #1b2640;
    --warn: #f0b860;    --warn-bg: #2a2313;
    --good: #5fcf98;    --bad: #ff8d7e;
    --code-bg: #1b1e26;
    --s1: #3987e5;      --s2: #d95926;      --s3: #199e70;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #13151a;      --bg-2: #1a1d24;    --bg-3: #232732;    --line: #2a2e39;   --line-2: #5c6475;
  --text: #e4e7ed;    --text-2: #aab1bf;  --text-3: #9097a7;
  --accent: #8eb0ff;  --accent-2: #adc5ff; --accent-bg: #1b2640;
  --warn: #f0b860;    --warn-bg: #2a2313;
  --good: #5fcf98;    --bad: #ff8d7e;
  --code-bg: #1b1e26;
  --s1: #3987e5;      --s2: #d95926;      --s3: #199e70;
}

/* type: 12, 14, 16, 18 (lead), 20, 30. spacing: 4, 8, 12, 16, 24, 32, 48, 64. radii: 4, 8, pills */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--top) + 24px); }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-2); text-decoration: underline; text-underline-offset: 3px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: 0.9em; }
code { background: var(--code-bg); padding: 0.1em 0.3em; border-radius: 4px; overflow-wrap: anywhere; }
mark { background: none; color: inherit; font-weight: 600; }
h1, h2, h3, h4, p, figure, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
h1, h2 { text-wrap: balance; }
[hidden] { display: none !important; }
.skip { position: absolute; left: 16px; top: -48px; z-index: 30; background: var(--accent); color: #fff; padding: 8px 12px; border-radius: 4px; }
.skip:focus { top: 8px; color: #fff; }

/* ---- the grid: top bar and page share the columns */
.top { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in, .shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr) var(--toc); max-width: 1440px; margin: 0 auto; }
.top-in { height: var(--top); align-items: center; position: relative; }
.col { width: 100%; max-width: calc(var(--col) + 48px); margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 12px; color: var(--text); font-weight: 600; white-space: nowrap; padding-left: 24px; }
.brand:hover { color: var(--text); text-decoration: none; }
.brand .gi { border-radius: 4px; background: var(--ground); flex: none; }
.search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 8px; }
.search:focus-within { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.search svg { flex: none; stroke: var(--text-3); fill: none; stroke-width: 1.8; stroke-linecap: round; }
#q { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: 16px var(--sans); padding: 0; }
#q::placeholder { color: var(--text-3); }
#q::-webkit-search-cancel-button { display: none; }
kbd { font: 12px var(--mono); color: var(--text-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.search:focus-within kbd { display: none; }
#clear { border: 0; background: none; color: var(--text-3); font-size: 20px; line-height: 1; padding: 4px 8px; }
.top-end { display: flex; justify-content: flex-end; gap: 8px; padding-right: 16px; }
.icon-btn { flex: none; display: inline-grid; place-items: center; width: 40px; height: 40px; border: 0; background: none; border-radius: 8px; padding: 0; color: var(--text-2); }
.icon-btn:hover { background: var(--bg-2); color: var(--text); }
.icon-btn svg { stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#menu { display: none; }
.side { position: sticky; top: var(--top); align-self: start; height: calc(100vh - var(--top)); overflow-y: auto; padding: 24px 12px 48px 16px; border-right: 1px solid var(--line); font-size: 14px; scrollbar-width: thin; }
.main { min-width: 0; }
.page { padding-top: 32px; padding-bottom: 96px; }
.toc { position: sticky; top: var(--top); align-self: start; max-height: calc(100vh - var(--top)); overflow-y: auto; padding: 36px 24px 32px 8px; font-size: 14px; }
.scrim { display: none; }

/* ---- sidebar: the sections; the entries of the current one */
.side a { display: flex; align-items: center; min-height: 32px; padding: 4px 8px; border-radius: 4px; color: var(--text); line-height: 1.35; }
.side a:hover { background: var(--bg-2); text-decoration: none; }
.side a[aria-current="page"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.side-label { margin: 24px 0 4px 8px; font: 600 12px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); }
.kids { margin: 4px 0 12px 16px; padding-left: 8px; border-left: 1px solid var(--line); }
.kids a { display: block; min-height: 0; padding: 4px 8px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kids a:hover { color: var(--text); }
.kids .pre { color: var(--text-3); }
.kids a[aria-current="page"] .pre { color: inherit; }

/* ---- on this page */
.toc h2 { font: 600 12px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
.toc a { display: block; padding: 4px 0 4px 12px; border-left: 2px solid var(--line); color: var(--text-2); line-height: 1.35; }
.toc a:hover { color: var(--text); text-decoration: none; }
.toc a.on { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

/* ---- the head of a page: path, title, one line of key facts */
.crumbs { font-size: 14px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 8px; min-height: 21px; }
.crumbs a { color: var(--text-2); }
.title { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.title h1 { font: 700 30px/1.2 var(--sans); letter-spacing: -0.02em; overflow-wrap: anywhere; min-width: 0; }
.title h1 .mono { font: 500 0.9em/1.2 var(--mono); letter-spacing: 0; }
.title .gi { flex: none; background: var(--ground); border-radius: 8px; }
.sub { margin-top: 8px; font-size: 14px; color: var(--text-2); max-width: var(--measure); }
.sub b { font-weight: 600; color: var(--text); }
.sub .dep { color: var(--bad); font-weight: 600; }
.sub .pc { vertical-align: middle; margin: -3px 4px 0 0; }
.lead { margin-top: 16px; font-size: 18px; line-height: 1.45; max-width: var(--measure); }
.page h2 { font: 600 20px/1.3 var(--sans); letter-spacing: -0.01em; margin: 48px 0 12px; scroll-margin-top: calc(var(--top) + 24px); }
.page h2.minor { font-size: 14px; letter-spacing: 0; color: var(--text-2); margin: 32px 0 8px; }
.page h3 { font: 600 16px/1.4 var(--sans); }
.sec > p, .lines li, .steps li, .note { max-width: var(--measure); }
.note { color: var(--text-3); font-size: 14px; margin-top: 8px; }
.kind { font: 600 12px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); }
.tagline { font-size: 14px; font-weight: 400; color: var(--text-3); white-space: nowrap; margin-right: 12px; }

/* ---- entry pieces */
.sig { position: relative; margin-top: 24px; background: var(--code-bg); border-radius: 8px; }
.sig pre { margin: 0; padding: 12px 72px 12px 16px; font: 14px/1.5 var(--mono); overflow-x: auto; white-space: pre; }
.copy { position: absolute; top: 8px; right: 8px; min-height: 28px; border: 0; background: var(--bg-3); border-radius: 4px; font-size: 12px; color: var(--text-2); padding: 4px 8px; }
.copy:hover { color: var(--text); }
.lines { display: grid; gap: 12px; }
.lines li { position: relative; padding-left: 20px; }
.lines li::before { content: ""; position: absolute; left: 4px; top: 0.62em; width: 5px; height: 5px; border-radius: 50%; background: var(--text-3); }
.refs { font-size: 12px; line-height: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
.refs a { color: var(--text-3); padding: 6px 3px; }
.refs a:hover { color: var(--accent); }
.warnsec h2 { display: flex; align-items: center; gap: 8px; }
.warnsec h2::before { content: "!"; flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--warn-bg); color: var(--warn); font: 700 12px/20px var(--sans); text-align: center; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 35%, transparent); }
.warnsec .lines li::before { background: var(--warn); }
.hit { margin-top: 24px; padding: 16px 24px; border-radius: 8px; background: var(--bg-2); }
.hit h2, .answer .hit h2 { margin: 0 0 8px; font-size: 14px; letter-spacing: 0; color: var(--text-2); }
.hit .tag { font-weight: 600; color: var(--warn); margin-right: 4px; }
.steps { counter-reset: step; display: grid; gap: 20px; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 0 12px; }
.steps li::before { content: counter(step); font: 600 12px/24px var(--sans); width: 24px; height: 24px; text-align: center; background: var(--bg-3); color: var(--text-2); border-radius: 50%; }
.steps .call { display: block; width: fit-content; font: 500 14px var(--mono); }
.more { margin-top: 12px; }
.more > summary { cursor: pointer; color: var(--accent); font-size: 14px; list-style: none; width: fit-content; padding: 2px 0; }
.more > summary::-webkit-details-marker { display: none; }
.more[open] > summary { margin-bottom: 12px; color: var(--text-3); }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 16px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th:last-child, td:last-child { padding-right: 0; }
th { font-weight: 600; color: var(--text-2); white-space: nowrap; }
td.n, th.n { text-align: right; white-space: nowrap; }
td.n, td.c { font-family: var(--mono); font-size: 0.9em; }
td.c { white-space: nowrap; }
td.zero { color: var(--text-3); }
td.up { font-weight: 700; }
.yn { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.yn svg { flex: none; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.yn.y svg { stroke: var(--good); } .yn.x svg { stroke: var(--bad); } .yn.x { color: var(--text-3); }
.members { table-layout: fixed; }
.members td:nth-child(1) { width: 184px; font-family: var(--mono); font-size: 0.9em; overflow-wrap: anywhere; }
.members td:nth-child(2) { width: 112px; color: var(--text-3); font-size: 12px; overflow-wrap: anywhere; }
.members tr.old td, .members tr.old a { color: var(--text-3); }
.consts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; }
.consts div { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 12px; padding: 8px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.consts dt { font: 0.8125em var(--mono); color: var(--text-2); overflow-wrap: break-word; min-width: 0; }
.consts dd { margin-left: auto; font: 600 0.8125em var(--mono); text-align: right; overflow-wrap: anywhere; }
.consts .long { grid-column: 1 / -1; display: block; }
.consts .long dd { margin: 4px 0 0; text-align: left; font-weight: 400; color: var(--text-2); }
.consts.wide { grid-template-columns: minmax(0, 1fr); }
.consts .cn { flex-basis: 100%; color: var(--text-3); font-size: 14px; max-width: var(--measure); }
.codes { display: flex; flex-wrap: wrap; gap: 8px; }
.codes span { font: 12px/24px var(--mono); padding: 0 8px; border-radius: 4px; background: var(--code-bg); color: var(--text-2); }
.codes span b { color: var(--text-3); font-weight: 400; margin-left: 8px; }
.links { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 24px; font-size: 14px; }
.links a { padding: 2px 0; overflow-wrap: anywhere; }
.reflist { list-style: decimal inside; font-size: 14px; color: var(--text-3); columns: 2 280px; column-gap: 24px; }
.reflist li { padding: 2px 0; break-inside: avoid; }
.reflist a { color: var(--text-2); }
.reflist a:hover { color: var(--accent); }

/* ---- start page and lists */
.hero h1 { font: 700 30px/1.2 var(--sans); letter-spacing: -0.02em; margin-top: 29px; }
.hero .lead { margin-top: 8px; color: var(--text-2); }
.tries { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.try, .chip, .tabs a { border: 0; background: var(--bg-2); border-radius: 999px; padding: 4px 12px; font-size: 14px; color: var(--text-2); white-space: nowrap; }
.try:hover, .chip:hover, .tabs a:hover { background: var(--bg-3); color: var(--text); text-decoration: none; }
.chip[aria-pressed="true"], .tabs a[aria-current="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.chip b, .tabs a b { font-weight: 400; margin-left: 8px; opacity: 0.8; }
.home h2 { margin-top: 64px; display: flex; align-items: baseline; gap: 16px; }
.home h2 a { font: 400 14px var(--sans); letter-spacing: 0; margin-left: auto; }
.topics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 48px; margin-top: 16px; }
.topic h3 a { color: var(--text); }
.topic h3 a:hover { color: var(--accent); text-decoration: none; }
.topic .cnt { font-size: 14px; color: var(--text-3); }
.topic ul { margin-top: 8px; display: grid; gap: 4px; }
.topic li a { display: block; padding: 2px 0; font-size: 14px; color: var(--text-2); }
.topic li a:hover { color: var(--accent); text-decoration: none; }
.cloud { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 14px; }
.cloud a { color: var(--text-2); padding: 2px 0; }
.cloud a:hover { color: var(--accent); text-decoration: none; }
.ledger { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 48px; margin-top: 16px; }
.lg h3 { font-size: 14px; margin-bottom: 4px; }
.lr { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 0 16px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); color: var(--text); font-size: 14px; }
.lr:hover { text-decoration: none; }
.lr:hover .ll { color: var(--accent); }
.lr b { font: 600 0.9em var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.lr .lu { color: var(--text-3); }
.rows { display: grid; gap: 24px; }
.rows a { display: block; color: var(--text); max-width: var(--measure); }
.rows a:hover { text-decoration: none; }
.rows a:hover .rt { color: var(--accent-2); text-decoration: underline; text-underline-offset: 3px; }
.rows .rt { font-weight: 600; color: var(--accent); margin-right: 12px; }
.rows .rs { display: block; color: var(--text-2); font-size: 14px; margin-top: 2px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 0; }

/* ---- results */
.rh { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 24px; }
.rh .count { color: var(--text-3); font-size: 14px; margin-right: auto; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.answer { padding-bottom: 32px; border-bottom: 1px solid var(--line); }
.answer.sel, .res.sel > a { outline: 2px solid var(--accent); outline-offset: 8px; border-radius: 4px; }
.answer .title { margin-top: 4px; }
.answer .title h2 { font: 700 20px/1.3 var(--sans); letter-spacing: -0.01em; margin: 0; overflow-wrap: anywhere; min-width: 0; }
.answer .title h2 .mono { font: 500 0.9em var(--mono); letter-spacing: 0; }
.answer .title a { color: inherit; }
.answer h2 { font-size: 16px; letter-spacing: 0; margin: 32px 0 8px; }
.answer .lead { font-size: 16px; line-height: 1.5; }
.open { display: inline-block; margin-top: 24px; font-weight: 600; }
.results { display: grid; }
.res > a { display: block; padding: 24px 0; border-bottom: 1px solid var(--line); color: var(--text); }
.res:last-child > a { border-bottom: 0; }
.res > a:hover { text-decoration: none; }
.res > a:hover h3 { color: var(--accent-2); text-decoration: underline; text-underline-offset: 3px; }
.res .title { margin-top: 4px; gap: 8px 12px; flex-wrap: wrap; align-items: baseline; }
.res .title h3 { color: var(--accent); overflow-wrap: anywhere; min-width: 0; }
.res .title h3 .mono { font: 500 0.9em var(--mono); }
.res .rs { display: block; color: var(--text-2); margin-top: 4px; font-size: 14px; max-width: var(--measure); }
.res .lines { margin-top: 8px; font-size: 14px; color: var(--text-2); gap: 4px; }
.empty { color: var(--text-2); padding: 24px 0; max-width: var(--measure); }
.gloss { margin: 0 0 24px; padding: 12px 16px; border-radius: 8px; background: var(--bg-2); font-size: 14px; color: var(--text-2); }
.gloss b { font: 600 0.9em var(--mono); color: var(--text); margin-right: 8px; }

/* ---- figures: a drawing and its caption. A scene keeps its own size; a chart or diagram takes the column. */
.figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 24px; margin-top: 32px; align-items: start; }
.fig { min-width: 0; display: grid; gap: 12px; align-content: start; }
.fig.wide { grid-column: 1 / -1; }
.figs.solo { grid-template-columns: minmax(0, 1fr); }
.figs.solo .fig.beside { grid-template-columns: auto minmax(0, 1fr); gap: 0 24px; align-items: start; }
.fig-art { --fig-bg: var(--bg-2); background: var(--fig-bg); border-radius: 8px; padding: 16px; overflow-x: auto; min-width: 0; }
.fig figcaption { font-size: 14px; color: var(--text-2); max-width: var(--measure); }
.fig-n { color: var(--text-3); margin-right: 8px; white-space: nowrap; }
.fig-t { color: var(--text); font-weight: 600; margin-right: 4px; }
.fig-t::after { content: "."; }
.fig-from { display: block; margin-top: 4px; }
.fig-svg { display: block; width: 100%; height: auto; margin: 0 auto; overflow: visible; }
.fig-svg text { font-family: var(--sans); }
.gi { display: inline-block; width: auto; margin: 0; overflow: visible; }

/* a scene is a piece of a room: on the game's ground in both themes, as large as its tiles */
.fig-scene .fig-art, .panel-art, .gi {
  --fig-bg: var(--ground); --tile: #323232; --tile-wall: #151515; --tile-swamp: #2f3a20; --tile-exit: #2b3a52;
  --g-fill: #3c3c3c; --g-line: #cfcfcf; --g-body: #101010; --g-core: #555555; --road: #5a5a5a;

                        var row = document.createElement('div'), key = document.createElement('i'), b = document.createElement('b'), name = document.createElement('span');

  }

  function kindOf(kind) { return index.entries.filter(function (e) { return e.kind === kind; }); }
  function withFigures() { return index.entries.filter(function (e) { return e.figures && e.figures.length; }); }
  function figureCount(list) { return list.reduce(function (n, e) { return n + e.figures.length; }, 0); }
  var BUCKETS = [
    ['Creeps', function (e) { return /^(Creep|PowerCreep)$/.test(e.id); }],
    ['Rooms and positions', function (e) { return /^(Room|RoomPosition|RoomObject|Room\.Terrain|RoomVisual|PathFinder|PathFinder\.CostMatrix|Flag|ConstructionSite|Store)$/.test(e.id); }],
    ['Structures', function (e) { return /^(Structure|OwnedStructure)/.test(e.id); }],
    ['Game, CPU, memory', function (e) { return /^(Game|Memory|RawMemory|InterShardMemory)/.test(e.id); }],
    ['Things in a room', function () { return true; }],
  ];
  function bucketOf(e) { for (var i = 0; i < BUCKETS.length; i++) if (BUCKETS[i][1](e)) return i; return BUCKETS.length - 1; }
  // The sections of the reference: ten topics of guides, five groups of API objects, the constants.
  // Each has a page that lists its entries (#t=<key>) and is one line in the sidebar.
  var SECTIONS = [];
  Object.keys(TOPICS).forEach(function (t) {
    var list = index.entries.filter(function (e) { return isGuide(e) && (e.topic || 'core') === t; });
    if (list.length) SECTIONS.push({ key: t, name: TOPICS[t], part: 'Guides', list: list.filter(function (e) { return e.kind === 'recipe'; }).concat(list.filter(function (e) { return e.kind === 'mechanic'; })) });
  });
  BUCKETS.forEach(function (b, bi) { SECTIONS.push({ key: 'api-' + bi, name: b[0], part: 'API', api: true, list: kindOf('object').filter(function (e) { return bucketOf(e) === bi; }) }); });
  SECTIONS.push({ key: 'constants', name: 'Constants', part: 'API', list: kindOf('constants') });
  function sectionOf(e) {
    var o = e.kind === 'method' || e.kind === 'property' ? engine.get(e.object) : e;
    for (var i = 0; i < SECTIONS.length; i++) if (o && SECTIONS[i].list.indexOf(o) !== -1) return SECTIONS[i];
    return null;
  }
  function sectionByKey(k) { return SECTIONS.filter(function (s) { return s.key === k; })[0]; }
  function crumbs(parts) { return '<nav class="crumbs" aria-label="Breadcrumb">' + parts.join('<span aria-hidden="true">/</span>') + '</nav>'; }

  // ---------------------------------------------------------------- views
  var FEATURED = ['recipe:harvest-and-haul'];

  function startPage() {
    var tries = ['move energy from one creep to another', 'how fast do containers decay in unowned rooms', 'who can destroy a road', 'what does a boosted HEAL part heal', 'tower damage at range 20', 'which calls cost 0.2 cpu'];
    var figs = withFigures();
    var h = '<div class="home"><section class="hero"><h1>What do you need to do?</h1><p class="lead">Ask in plain words. You get the call, what it costs, what it returns and what goes wrong, with a drawing where one explains it faster.</p>' +
      '<div class="tries">' + tries.map(function (t) { return '<a class="try" href="#q=' + encodeURIComponent(t) + '">' + esc(t) + '</a>'; }).join('') + '</div></section>';

    h += '<h2 id="s-guides">Guides</h2><div class="topics">' + SECTIONS.filter(function (s) { return s.part === 'Guides'; }).map(function (s) {
      var r = s.list.filter(function (e) { return e.kind === 'recipe'; }).length, m = s.list.length - r;
      var top = s.list.filter(function (e) { return e.figures; }).concat(s.list.filter(function (e) { return !e.figures; })).slice(0, 4);
      return '<div class="topic"><h3><a href="#t=' + s.key + '">' + esc(s.name) + '</a></h3><p class="cnt">' + (r ? plural(r, 'recipe') : '') + (m && r ? ', ' : '') + (m ? plural(m, 'mechanic') : '') + '</p>' +
        '<ul>' + top.map(function (e) { return '<li><a href="' + href(e.id) + '">' + esc(e.title) + '</a></li>'; }).join('') + '</ul></div>';
    }).join('') + '</div>';

    var feat = FEATURED.map(function (id) { return engine.get(id); }).filter(function (e) { return e && e.figures; });
    if (feat.length) {
      h += '<h2 id="s-figures">Figures <a href="#f=all">All ' + figureCount(figs) + ' figures</a></h2><div class="figs solo" style="margin-top:16px">' + feat.map(function (e) {
        return F.render(e.figures[0], { more: '<a class="fig-from" href="' + href(e.id) + '">' + esc(label(e)) + '</a>' });
      }).join('') + '</div>';
    }

    h += '<h2 id="s-numbers">Numbers most questions end in</h2><div class="ledger">' + (index.cheats || []).map(function (g) {
      return '<div class="lg"><h3>' + esc(g.title) + '</h3>' + g.rows.map(function (r) {
        return '<a class="lr" href="' + href(r.to) + '"><b>' + esc(r.value) + '</b><span><span class="ll">' + esc(r.label) + '</span>' + (r.unit ? ' <span class="lu">· ' + esc(r.unit) + '</span>' : '') + '</span></a>';
      }).join('') + '</div>';
    }).join('') + '</div>';

    h += '<h2 id="s-api">API reference</h2><div class="topics">' + SECTIONS.filter(function (s) { return s.part === 'API'; }).map(function (s) {
      return '<div class="topic"><h3><a href="#t=' + s.key + '">' + esc(s.name) + '</a></h3><p class="cnt">' + (s.api ? plural(s.list.length, 'object') : plural(Object.keys(C).length, 'value') + ' in ' + s.list.length + ' groups') + '</p>' +
        '<div class="cloud">' + s.list.map(function (e) { return '<a' + (s.api ? ' class="mono" translate="no"' : '') + ' href="' + href(e.id) + '">' + esc(label(e)) + '</a>'; }).join('') + '</div></div>';
    }).join('') + '</div></div>';
    return h;
  }

  function rowHtml(e) { return '<li><a href="' + href(e.id) + '"><span class="rt' + (isApi(e) ? ' mono' : '') + '">' + esc(label(e)) + '</span>' + tags(e) + '<span class="rs">' + rich(e.summary || e.doc || '') + '</span></a></li>'; }
  // the page of a section: its entries with one line each
  function topicPage() {
    var s = sectionByKey(state.t);
    if (!s) return '<p class="empty">No section “' + esc(state.t) + '”. <a href="#">Back to the start</a>.</p>';
    var part = function (list, name) { return list.length ? section(name, '<ul class="rows">' + list.map(rowHtml).join('') + '</ul>') : ''; };
    var h = crumbs(['<a href="#">Start</a>', esc(s.part)]) + '<div class="title"><h1>' + esc(s.name) + '</h1></div>';
    if (s.part === 'Guides') return h + part(s.list.filter(function (e) { return e.kind === 'recipe'; }), 'Recipes: how to do it') + part(s.list.filter(function (e) { return e.kind === 'mechanic'; }), 'Mechanics: how it works');
    return h + '<ul class="rows" style="margin-top:32px">' + s.list.map(rowHtml).join('') + '</ul>';
  }

  // every figure, one section at a time
  function galleryPage() {
    var all = withFigures(), groups = [];
    SECTIONS.forEach(function (s) { if (s.part !== 'Guides') return; var l = all.filter(function (e) { return s.list.indexOf(e) !== -1; }); if (l.length) groups.push([s.key, s.name, l]); });
    var api = all.filter(isApi), cons = all.filter(function (e) { return e.kind === 'constants'; });
    if (api.length) groups.push(['api', 'API calls', api]);
    if (cons.length) groups.push(['constants', 'Constants', cons]);
    var pick = groups.some(function (g) { return g[0] === state.f; }) ? state.f : groups.length ? groups[0][0] : '';
    var h = crumbs(['<a href="#">Start</a>']) + '<div class="title"><h1>Figures</h1></div><p class="lead">Every drawing in the reference, ' + figureCount(all) + ' in all. Each belongs to an entry that carries the rule in words and the code that proves it.</p>' +
      '<nav class="tabs" aria-label="Section">' + groups.map(function (g) { return '<a href="#f=' + g[0] + '" aria-current="' + (pick === g[0]) + '">' + esc(g[1]) + '<b>' + figureCount(g[2]) + '</b></a>'; }).join('') + '</nav>';
    groups.forEach(function (g) {
      if (pick !== g[0]) return;
      h += '<div class="figs gallery">' + g[2].map(function (e) {
        return e.figures.map(function (f) { return F.render(f, { more: '<a class="fig-from' + (isApi(e) ? ' mono' : '') + '" href="' + href(e.id) + '">' + esc(label(e)) + '</a>' }); }).join('');
      }).join('') + '</div>';
    });
    return h;
  }

  function resultsPage() {
    var all = engine.search(state.q, { limit: 40 });
    var mk = engine.marker(state.q);
    var counts = { '': all.length };
    all.forEach(function (r) { var g = group(r.entry); counts[g] = (counts[g] || 0) + 1; });
    if (state.k && !counts[state.k]) state.k = '';
    var res = (state.k ? all.filter(function (r) { return group(r.entry) === state.k; }) : all).slice(0, 12);
    shown = res.map(function (r) { return r.entry.id; });
    var consts = (state.q.match(/\b[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+\b/g) || []).map(constHtml).join('');
    // community words in the query, explained in one line each
    consts = engine.glossary(state.q).map(function (g) {
      var t = engine.get(g.entry);
      return '<p class="gloss"><b>' + esc(g.term) + '</b> ' + rich(g.means) + ' <a href="' + href(g.entry) + '">' + esc(t ? label(t) : g.entry) + '</a></p>';
    }).join('') + consts;
    if (!res.length && !consts) {
      return '<p class="empty">Nothing matches “' + esc(state.q) + '”. Try the verb and the thing (repair road, boost creep), a method name, or a constant such as <code>ROAD_DECAY_TIME</code>.</p>';
    }
    var h = '<div class="rh"><p class="count">' + all.length + (all.length === 40 ? '+' : '') + ' entries match</p><div class="chips" role="group" aria-label="Kind">' + FILTERS.map(function (f) {
      var n = counts[f[0]] || 0;
      return n ? '<button class="chip" type="button" data-k="' + f[0] + '" aria-pressed="' + (state.k === f[0]) + '">' + f[1] + '<b>' + n + '</b></button>' : '';
    }).join('') + '</div></div>' + consts;
    if (res.length) {
      var top = res[0], e = top.entry;
      h += '<article class="answer" data-i="0">' + kindLine(e) + '<div class="title"><h2><a href="' + href(e.id) + '">' + titleHtml(e) + '</a></h2></div>' + subLine(e) +
        body(e, { mk: mk, lines: top.lines, top: true }) + '<a class="open" href="' + href(e.id) + '">Open the full entry</a></article>';
      h += '<ol class="results">' + res.slice(1).map(function (r, i) {
        var x = r.entry;
        return '<li class="res" data-i="' + (i + 1) + '"><a href="' + (x.kind === 'article' ? esc(x.url) + '" target="_blank" rel="noopener' : href(x.id)) + '">' + kindLine(x) +
          '<div class="title"><h3>' + titleHtml(x) + '</h3>' + tags(x) + '</div><span class="rs">' + rich(x.summary || x.doc || '', mk) + '</span>' +
          (r.lines.length ? '<ul class="lines">' + r.lines.slice(0, 2).map(function (l) { return '<li>' + rich(l.text, mk) + '</li>'; }).join('') + '</ul>' : '') + '</a></li>';
      }).join('') + '</ol>';
    }
    return h;
  }

  function entryPage() {
    var e = engine.get(state.e);
    if (!e) return '<p class="empty">No entry “' + esc(state.e) + '”. <a href="#">Back to the start</a>.</p>';
    var s = sectionOf(e), path = [esc(s ? s.part : KIND[e.kind] || e.kind)];
    if (s) path.push('<a href="#t=' + s.key + '">' + esc(s.name) + '</a>');
    if (e.kind === 'method' || e.kind === 'property') path.push('<a class="mono" translate="no" href="' + href(e.object) + '">' + esc(e.object) + '</a>');
    return '<article class="entry">' + crumbs(path) + '<div class="title">' + objIcon(e, 40) + '<h1>' + titleHtml(e) + '</h1></div>' + subLine(e) + body(e, { full: true }) + '</article>';
  }

  // the sections of the page, on the right; the one in view is marked
  var spy;
  function buildToc() {
    if (spy) { spy.disconnect(); spy = null; }
    var heads = state.q.trim() ? [] : Array.prototype.slice.call(out.querySelectorAll('.page h2[id]'));
    if (heads.length < 3) { tocEl.innerHTML = ''; return; }
    tocEl.innerHTML = '<h2>On this page</h2>' + heads.map(function (hd, i) { return '<a href="#' + hd.id + '" data-to="' + hd.id + '"' + (i ? '' : ' class="on"') + '>' + esc(hd.firstChild.textContent) + '</a>'; }).join('');
    if (!('IntersectionObserver' in window)) return;
    var seen = {};
    spy = new IntersectionObserver(function (items) {
      items.forEach(function (it) { seen[it.target.id] = it.isIntersecting; });
      var first = heads.filter(function (hd) { return seen[hd.id]; })[0];
      if (!first) return;
      Array.prototype.forEach.call(tocEl.querySelectorAll('a'), function (a) { a.classList.toggle('on', a.getAttribute('data-to') === first.id); });
    }, { rootMargin: '-64px 0px -55% 0px' });
    heads.forEach(function (hd) { spy.observe(hd); });
  }
  tocEl.addEventListener('click', function (ev) {
    var a = ev.target.closest('a[data-to]');
    if (!a) return;
    ev.preventDefault();   // the address keeps the entry; only the view moves
    var t = document.getElementById(a.getAttribute('data-to'));
    if (t) t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  });

  function render() {
    var e = state.e && engine.get(state.e), s = state.t && sectionByKey(state.t);
    document.title = (state.e ? label(e || { id: state.e }) + ' · ' : state.q ? state.q + ' · ' : s ? s.name + ' · ' : state.f ? 'Figures · ' : '') + 'Screeps lookup';
    clearEl.hidden = !qEl.value;
    sel = 0; shown = [];
    out.innerHTML = '<div class="col page">' + (state.e ? entryPage() : state.q.trim() ? resultsPage() : state.t ? topicPage() : state.f ? galleryPage() : startPage()) + '</div>';
    F.wire(out);
    buildToc();
    buildRail();
  }

  // ---------------------------------------------------------------- sidebar: every section on one line; the entries of the current one below it
  function buildRail() {
    var plain = !state.q.trim(), e = state.e && plain && engine.get(state.e);
    var here = e ? sectionOf(e) : plain && state.t ? sectionByKey(state.t) : null;
    var cur = e ? (e.kind === 'method' || e.kind === 'property' ? e.object : e.id) : '';
    var a = function (to, text, on, cls) { return '<a href="' + to + '"' + (cls ? ' class="' + cls + '"' : '') + (on ? ' aria-current="page"' : '') + '>' + text + '</a>'; };
    var h = a('#', 'Start', plain && !state.e && !state.t && !state.f, 'home') + a('#f=all', 'Figures', plain && !state.e && !!state.f), part = '';
    SECTIONS.forEach(function (s) {
      if (s.part !== part) { part = s.part; h += '<div class="side-label">' + part + '</div>'; }
      h += a('#t=' + s.key, esc(s.name), here === s && !e);
      if (here === s) {
        h += '<ul class="kids">' + s.list.map(function (x) {
          var t = label(x), m = s.api && /^Structure(?=[A-Z])/.exec(t);
          return '<li><a href="' + href(x.id) + '" title="' + esc(t) + '"' + (s.api ? ' class="mono" translate="no"' : '') + (x.id === cur ? ' aria-current="page"' : '') + '>' + (m ? '<span class="pre">Structure</span>' + esc(t.slice(9)) : esc(t)) + '</a></li>';
        }).join('') + '</ul>';
      }
    });
    rail.innerHTML = h;
    var on = rail.querySelector('.kids a[aria-current="page"]');
    if (on && (on.offsetTop < rail.scrollTop || on.offsetTop > rail.scrollTop + rail.clientHeight - 48)) rail.scrollTop = on.offsetTop - rail.clientHeight / 2;
  }
  function nav(openIt) {
    document.body.classList.toggle('nav-open', openIt);
    document.getElementById('menu').setAttribute('aria-expanded', String(openIt));
  }

  // ---------------------------------------------------------------- state and events
  var places = {}, isPop = false;   // where each address was scrolled to, so Back returns there
  function key() { return location.hash || '#'; }
  window.addEventListener('scroll', function () { places[key()] = window.scrollY; }, { passive: true });
  window.addEventListener('popstate', function () { isPop = true; });
  function readHash() {
    var h = location.hash.replace(/^#/, ''), s = { q: '', k: '', e: '', t: '', f: '' };
    h.split('&').forEach(function (p) { var i = p.indexOf('='); if (i > 0 && s.hasOwnProperty(p.slice(0, i))) { try { s[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); } catch (x) {} } });
    state = s;
    // typing updates the address with replaceState, so a hashchange always comes from a link or the back button
    if (qEl.value !== state.q) qEl.value = state.q;
    nav(false);
    render();
    window.scrollTo(0, isPop ? places[key()] || 0 : 0);
    isPop = false;
  }
  function writeHash() {
    var h = state.q ? '#q=' + encodeURIComponent(state.q) + (state.k ? '&k=' + encodeURIComponent(state.k) : '') : '';
    history.replaceState(null, '', h || location.pathname + location.search);
  }
  function typed() { state.q = qEl.value; state.e = ''; state.t = ''; state.f = ''; writeHash(); render(); window.scrollTo(0, 0); }
  function select(i) {
    var items = out.querySelectorAll('[data-i]');
    if (!items.length) return;
    sel = Math.max(0, Math.min(items.length - 1, i));
    Array.prototype.forEach.call(items, function (el, n) { el.classList.toggle('sel', n === sel); });
    items[sel].scrollIntoView({ block: 'nearest' });
  }

  var timer;
  qEl.addEventListener('input', function () { clearTimeout(timer); clearEl.hidden = !qEl.value; timer = setTimeout(typed, 60); });
  qEl.addEventListener('keydown', function (ev) {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { if (shown.length) { ev.preventDefault(); select(sel + (ev.key === 'ArrowDown' ? 1 : -1)); } }
    else if (ev.key === 'Enter' && shown.length) { clearTimeout(timer); if (state.q !== qEl.value) typed(); if (shown[sel]) location.hash = href(shown[sel]); }
    else if (ev.key === 'Escape') { qEl.value = ''; typed(); }
  });
  clearEl.addEventListener('click', function () { qEl.value = ''; typed(); qEl.focus(); });
  out.addEventListener('click', function (ev) {
    var chip = ev.target.closest('.chip');
    if (chip) { state.k = chip.getAttribute('data-k'); writeHash(); render(); return; }
    var copy = ev.target.closest('[data-copy]');
    if (copy) {
      var text = copy.getAttribute('data-copy'), done = function () { copy.textContent = 'Copied'; setTimeout(function () { copy.textContent = 'Copy'; }, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { selectText(copy.parentNode.querySelector('pre')); });
      else selectText(copy.parentNode.querySelector('pre'));
    }
  });
  function selectText(el) { var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  function goHome(ev) { ev.preventDefault(); qEl.value = ''; state = { q: '', k: '', e: '', t: '', f: '' }; history.pushState(null, '', location.pathname + location.search); nav(false); render(); window.scrollTo(0, 0); }
  document.getElementById('home').addEventListener('click', goHome);
  rail.addEventListener('click', function (ev) {
    if (ev.target.closest('a.home')) goHome(ev);
    else if (ev.target.closest('a')) nav(false);
  });
  document.getElementById('menu').addEventListener('click', function () { nav(!document.body.classList.contains('nav-open')); });
  document.getElementById('scrim').addEventListener('click', function () { nav(false); });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === '/' && document.activeElement !== qEl && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { ev.preventDefault(); qEl.focus(); qEl.select(); }
    else if (ev.key === 'Escape') nav(false);
  });
  window.addEventListener('hashchange', readHash);

  // theme: follows the system until the button is used; a link can carry it (?theme=dark)
  var rootEl = document.documentElement;
  try { var saved = localStorage.getItem('theme'); if (saved === 'dark' || saved === 'light') rootEl.setAttribute('data-theme', saved); } catch (x) {}
  var asked = /[?&]theme=(dark|light)\b/.exec(location.search);
  if (asked) rootEl.setAttribute('data-theme', asked[1]);
  document.getElementById('theme').addEventListener('click', function () {
    var dark = rootEl.getAttribute('data-theme') ? rootEl.getAttribute('data-theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    var next = dark ? 'light' : 'dark';
    rootEl.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (x) {}
  });

  document.getElementById('home').innerHTML = F.icon('creep', 28, { body: 'WWCCMM' }) + '<span>Screeps lookup</span>';
  var m = index.meta, src = m.sources;
  document.getElementById('footer').innerHTML =
    '<p>' + m.counts.method + ' methods, ' + m.counts.property + ' properties, ' + m.counts.mechanic + ' mechanics, ' + m.counts.recipe + ' recipes, ' + (m.figures || 0) + ' figures, ' + Object.keys(C).length + ' constants. Built from ' +
    Object.keys(src).map(function (k) { var s = src[k]; return '<a href="' + esc(s.repo) + (s.commit ? '/tree/' + esc(s.commit) : '') + '" target="_blank" rel="noopener">' + esc(k) + (s.version ? ' ' + esc(s.version) : '') + '</a>' + (s.date ? ' (' + esc(s.date) + ')' : ''); }).join(', ') + '.</p>' +
    '<p>' + esc(m.attribution) + ' <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> · <a href="https://docs.screeps.com/api/" target="_blank" rel="noopener">Official API reference</a></p>';

  readHash();
  if (matchMedia('(pointer: fine)').matches && !state.e && !state.t && !state.f) qEl.focus();
}());
</script>
</body>
</html>
